id: fenrir-chain
name: "Huginn - Multi-stage host execution and secret extraction by one caller"
tier: core
fenrir_ops: [X-08, X-10, X-13, X-14, P-12, P-13]
# status: draft | validated (validated only after a lab run proved it; see docs/STATUS.md)
status: validated
# validation: ci (benign replay in replay.yml) | manual (docs/PURPLE-TEAM.md or a manual replay)
validation: ci
# deployable: false = needs a licence or a table this tenant does not have
deployable: true
requires_licence: none
# severity: default only; the query's Severity column overrides it per alert
severity: Medium
severity_column: Severity
frequency: PT5M
# lookback: Sentinel query period, at most P14D; must cover the query's longest baseline
lookback: PT4H
trigger_threshold: 0
# alert_name_format: per-alert title; {{Column}} placeholders come from the query output
alert_name_format: "Huginn: multi-stage secret extraction by {{Caller}}"
entities:
  - type: Account
    fields:
      AadUserId: CallerOid
      FullName: Caller
  - type: AzureResource
    fields:
      ResourceId: TargetResource
mitre:
  tactics: [Execution, CredentialAccess, DefenseEvasion, LateralMovement]
  techniques: [T1651, T1552, T1550.001]
branches:
  multi-stage: ci         # 2+ stages or 3+ targets by one non-managed caller
  identity-pivot: manual  # managed identity acting from the user's IP; needs a real Fenrir run
